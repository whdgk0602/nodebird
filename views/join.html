{% extends 'layout.html' %}

{% block content %}
  <div class="timeline">
    <form id="join-form" class="card-form" action="/auth/join" method="post">
      <input type="hidden" name="_csrf" value="{{csrfToken}}">
      <h2>회원가입</h2>
      <div class="input-group">
        <label for="join-email">이메일</label>
        <input id="join-email" type="email" name="email" required>
      </div>
      <div class="input-group">
        <label for="join-nick">닉네임</label>
        <input id="join-nick" type="text" name="nick" maxlength="15" required>
      </div>
      <div class="input-group">
        <label for="join-password">비밀번호</label>
        <input id="join-password" type="password" name="password" minlength="4" required>
      </div>
      <button id="join-btn" type="submit" class="btn btn-primary">회원가입</button>
    </form>
  </div>
{% endblock %}

{% block script %}
  <script src="/js/join.js"></script>
{% endblock %}
